{% extends 'base.html' %}

{% block title %}Delete Property{% endblock %}

{% block content %}
<div class="alert alert-danger">
    <h3>Are you sure you want to delete "{{ property.title }}"?</h3>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'property_detail' property.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
